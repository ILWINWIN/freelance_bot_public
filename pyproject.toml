[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-bot"
version = "0.1.0"
description = "Extensible freelance order assistant"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
